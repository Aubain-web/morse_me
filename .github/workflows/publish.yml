name: Publish

on:
  # Two ways in:
  #   - a push to `main` bumps the patch version, tags it and publishes it;
  #   - a `v*` tag publishes exactly what that tag points at, without bumping.
  #
  # The bump commit is pushed with GITHUB_TOKEN, and GitHub deliberately does
  # not start new workflow runs for those pushes, so this cannot loop. The
  # `[skip ci]` marker in the commit message is the belt to that suspenders: it
  # still holds if the push is ever switched to a PAT or an app token.
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # push the bump commit and its tag
  id-token: write # npm Trusted Publishing (OIDC)

# Never cancel a publish, and never let two of them race: the second would push
# a bump on top of a stale main and be rejected.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Check out the branch itself, not the detached commit, so the bump
          # has somewhere to land. On a tag run this resolves to the tag.
          ref: ${{ github.ref_name }}

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Ensure npm supports trusted publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Publishing version ${PKG_VERSION}"

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # Only after the gates above are green, so a broken main burns a CI run
      # rather than a version number.
      - name: Bump patch version and tag
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version patch -m 'chore(release): v%s [skip ci]'
          git push --follow-tags
          echo "Publishing version $(node -p "require('./package.json').version")"

      # Auth is handled by npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
      # Provenance is generated automatically; keep --access public for the scoped package.
      - name: Publish to npm
        run: npm publish --access public
